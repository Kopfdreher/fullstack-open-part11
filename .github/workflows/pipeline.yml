name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run npm test
        run: npm test
      - name: Run npm build
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Smoke test prod bundle
        run: |
          npm run start-prod & sleep 5
          curl -f http://localhost:5001/health
          curl -f http://localhost:5001/version

  deploy:
    needs: [tests]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -f -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [deploy]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  success_note:
    needs: [deploy]
    if: ${{ github.event_name == 'push' && success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Success
          title: "New version deployed"
          description: "to https://fullstack-open-part11.onrender.com/ by ${{ github.event.head_commit.author.name }}"
          url: "${{ github.event.head_commit.url }}"
          username: "Github Actions"
          color: 0x28a745

  failure_note:
    needs: [tests, deploy]
    if: ${{ github.event_name == 'push' && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Failure
          title: "Build was failing"
          description: |
            commit ${{ github.event.head_commit.message }} by ${{ github.event.head_commit.author.name }} broke
            ${{ github.event.head_commit.url }}
          url: "${{ github.event.head_commit.url }}"
          username: "Github Actions"
          color: 0xe01b24
